<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5b3a7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="魔女鍋神経衰弱">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon.png">
<title>魔女鍋 神経衰弱</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:#4a2e5c;
 background:radial-gradient(circle at 50% 0,#fbe7f3,#e4d4f5 60%,#cdb8ea);user-select:none}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
h1{text-align:center;font-size:26px;margin:14px 0 4px;color:#7a3f8f;text-shadow:0 2px 0 #fff}
.sub{text-align:center;font-size:13px;opacity:.75;margin-bottom:14px}
.panel{background:#fffaf7;border:3px solid #c9a6e0;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 0 #b892d4}
.panel h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:70px;padding:10px 4px;border-radius:12px;border:2px solid #d8bde9;background:#fff;font-size:15px;color:inherit;font-family:inherit}
.opt.on{background:#f3b6d5;border-color:#d0679f;color:#fff;font-weight:bold}
.big{display:block;width:100%;padding:14px;font-size:20px;font-weight:bold;border:0;border-radius:16px;color:#fff;font-family:inherit;
 background:linear-gradient(#e889b8,#c75c97);box-shadow:0 4px 0 #9b3f72;margin-top:10px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #9b3f72}
.ghost{background:#fff;color:#7a3f8f;box-shadow:0 4px 0 #c9a6e0;border:2px solid #c9a6e0}
input.name{width:100%;padding:8px;font-size:15px;border-radius:10px;border:2px solid #d8bde9;margin:4px 0;font-family:inherit}
#hud{padding-right:48px;min-height:40px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:15px}
#who{font-weight:bold}
#score b{font-size:22px;color:#c75c97}
#timebar{height:14px;border-radius:7px;background:#fff;border:2px solid #d8bde9;overflow:hidden;margin-bottom:8px}
#timefill{height:100%;background:linear-gradient(90deg,#9ad08a,#f3d36b);transition:width .2s linear}
#timefill.low{background:#ef7a8f}
#timetxt{text-align:center;font-size:13px;margin:-4px 0 6px}
#board{display:grid;gap:5px;margin:0 -4px}
.card{position:relative;aspect-ratio:5/6;perspective:600px;cursor:pointer}
.in{position:absolute;inset:0;transition:transform .25s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b{background:repeating-linear-gradient(45deg,#8a5bb3 0 8px,#7a4ca3 8px 16px);border:3px solid #fff;box-shadow:0 2px 4px #0003;
 display:flex;align-items:center;justify-content:center;color:#ffe48a;font-size:22px}
.f{transform:rotateY(180deg);background:#fffdf6;border:3px solid #f0c7de;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px #0002}
.f img{width:96%;height:96%;object-fit:contain;pointer-events:none}
.f,.b{border-width:2px!important}
.f.bad{background:#f1ecf4;border-color:#b9a6c8}
.pen{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:24px;font-weight:bold;color:#e0446a;
 text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff;animation:pen 1.1s ease-out forwards;z-index:3;pointer-events:none}
@keyframes pen{0%{transform:translateY(0) scale(1.3);opacity:1}100%{transform:translateY(-40px);opacity:0}}
body.shake #board{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.spark{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);animation:spark .85s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 0 6px #fff}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
 100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 30px)) rotate(var(--rot)) scale(1);opacity:0}}
.ring{position:fixed;z-index:19;width:20px;height:20px;border-radius:50%;border:4px solid #ffd84a;transform:translate(-50%,-50%);
 pointer-events:none;animation:ring .55s ease-out forwards;box-shadow:0 0 12px #ffd84a}
@keyframes ring{to{width:170px;height:170px;opacity:0;border-width:1px}}
.flash{position:fixed;inset:0;z-index:18;pointer-events:none;background:radial-gradient(circle,#fff8 0,#ffd84a44 50%,transparent 75%);animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.matchTxt{position:fixed;left:50%;top:40%;z-index:21;pointer-events:none;text-align:center;transform:translate(-50%,-50%);animation:mt .9s ease-out forwards}
.matchTxt img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 18px #ffd84a)}
.matchTxt div{font-size:18px;font-weight:bold;color:#7a3f8f;text-shadow:0 0 4px #fff,0 0 4px #fff}
.matchTxt b{display:block;font-size:34px;color:#ff5f9e;text-shadow:0 3px 0 #fff,0 0 10px #ffd84a,0 0 4px #fff;letter-spacing:2px}
@keyframes mt{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
 45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.card.got .f{box-shadow:0 0 12px #ffd84a,0 2px 4px #0002;border-color:#9ad08a;background:#f2fbe9}
.card.got{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}
.nm{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#7a5a88;text-shadow:0 0 3px #fff,0 0 3px #fff}
#overlay{position:fixed;inset:0;background:#3b1f4d99;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#overlay .panel{max-width:420px;width:100%;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px;border-bottom:1px dashed #e2cdf0}
.hide{display:none}
#plist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ch{position:relative;border:3px solid #e2cdf0;border-radius:14px;background:linear-gradient(#fff,#f5ecfb);padding:4px 2px 2px;text-align:center;cursor:pointer;transition:.15s}
.ch img{height:120px;max-width:100%;object-fit:contain;display:block;margin:0 auto;pointer-events:none}
.ch .cn{font-size:14px;font-weight:bold;margin-top:2px}
.ch.on{border-color:#d0679f;background:linear-gradient(#fff,#fbd9ea);transform:translateY(-3px);box-shadow:0 4px 0 #d0679f}
.ch .no{position:absolute;top:2px;left:4px;background:#d0679f;color:#fff;border-radius:10px;font-size:12px;padding:0 6px}
#who img{height:40px;vertical-align:middle;margin-right:4px}
#snd{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 8px);width:40px;height:40px;border-radius:20px;border:2px solid #c9a6e0;background:#fff;font-size:18px;z-index:5}
</style>
</head>
<body>
<button id="snd">🔊</button>
<div id="app">
 <div id="title">
  <h1>🧪 魔女鍋 神経衰弱</h1>
  <div class="sub">45秒以内に、材料をぜんぶそろえられるかな？<br>何回でもめくってOK。はやくそろえるほど上位です</div>
  <div class="panel"><h2>人数（ひとり45秒ずつ交代）</h2><div class="row" id="optPlayers"></div></div>
  <div class="panel"><h2>プレイヤーを選ぶ <span id="selInfo" style="font-size:13px;font-weight:normal"></span></h2>
   <div id="plist"></div></div>
  <div class="panel"><h2>カードの数</h2><div class="row" id="optPairs"></div></div>
  <button class="big" id="start">はじめる</button>
  <div class="panel"><h2>📖 <span id="histName"></span> の履歴</h2><div id="hist"></div>
   <button class="opt" id="clearHist" style="width:100%;margin-top:10px;color:#b5476f;border-color:#e8a9c3">🗑 <span id="clearName"></span> の履歴を消す</button></div>
  <div class="panel"><h2>🏆 ランキング <span id="rankSub" style="font-size:13px;font-weight:normal"></span></h2>
   <div class="row" id="rankTabs" style="gap:4px;margin-bottom:8px"></div><div id="rank"></div></div>
 </div>
 <div id="game" class="hide">
  <div id="hud"><div id="who"></div><div id="score"></div></div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="timetxt"></div>
  <div id="board"></div>
  <button class="big ghost" id="quit">タイトルへ</button>
 </div>
</div>
<div id="overlay"><div class="panel" id="result"></div></div>
<script>
const LIMIT=45;  // 制限時間（秒）。2026-11-26 に 40→30→45
// ハズレのカード（1枚ずつ。そろえなくてよい）。めくると効果が出て、表のまま残る。絵は 魔女鍋可愛い絵\out\food_round の毒きのこ S302・魚の骨 S301
const HAZURE=[{k:"minus",sec:3,n:"どくきのこ"},{k:"minus",sec:3,n:"どくきのこ"},{k:"minus",sec:3,n:"どくきのこ"},{k:"none",sec:0,n:"さかなのほね"}];
const FOODS={tomato:"トマト",lime:"ライム",lemon:"レモン",blueberry:"ブルーベリー",plum:"プラム",orange:"みかん",cheese:"チーズ",
rice:"ごはん",nori:"のり",bread:"パン",patty:"おにく",lettuce:"レタス",chicken:"とりにく",oil:"あぶら",egg:"たまご",flour:"こむぎこ",
milk:"ぎゅうにゅう",noodles:"めん",soy_sauce:"しょうゆ",sausage:"ソーセージ",potato:"じゃがいも",carrot:"にんじん",onion:"たまねぎ",
red_bean:"あんこ",fish:"さかな",strawberry:"いちご"};
const $=id=>document.getElementById(id);
// プレイヤーキャラ（絵は 魔女鍋可愛い絵\tools\export_players.py で書き出し。名前はオーナーが決めた）
const CHARS={なおき:"naoki",けいご:"keigo",りゅう:"ryu",しゅう:"shu"};
const S={players:1,pairs:8,sel:["りゅう"],mute:false};
const save=JSON.parse(localStorage.getItem("mjs2_save")||"{}");
Object.assign(S,save.set||{});
// キャラごとの履歴：save.people[名前] = [{d:日時, p:カード組数, c:クリアしたか, t:クリアまでの秒（失敗は null）, s:そろえた組, m:めくった回数}, ...]（新しい順）
// c が無いのは、組の数を競っていたころ（2026-11-26 まで）の記録。ランキングには入れない
save.people=save.people||{};for(const n in CHARS)save.people[n]=save.people[n]||[];
S.sel=S.sel.filter(n=>n in CHARS);if(!S.sel.length)S.sel=["りゅう"];
S.names=S.sel;
function store(){save.set={players:S.players,pairs:S.pairs,sel:S.sel,mute:S.mute};localStorage.setItem("mjs2_save",JSON.stringify(save))}

// ---- 音 ----
// 曲：ComfyUI（Stable Audio 3 Medium）で作った F4_accordion_polka_t1（2026-11-26 採用、90秒）。1回40秒なので、曲全体をくり返す
const BGM_LOOP=[0,90];
let AC,buf={},bgmSrc,bgmGain;
const SND={bgm:["sound/bgm.mp3",.45],pair:["sound/pair.mp3",.9],flip:["sound/flip.mp3",.6],clear:["sound/clear.mp3",.8],start:["sound/start.mp3",.7]};
function initAudio(){
 if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 for(const k in SND)fetch(SND[k][0]).then(r=>r.arrayBuffer()).then(a=>AC.decodeAudioData(a)).then(b=>{buf[k]=b;if(k=="bgm"&&wantBgm)playBgm()}).catch(()=>{});
}
function se(k){if(S.mute||!AC||!buf[k])return;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=SND[k][1];s.buffer=buf[k];s.connect(g).connect(AC.destination);s.start()}
let wantBgm=false;
function playBgm(){wantBgm=true;if(S.mute||!AC||!buf.bgm||bgmSrc)return;
 bgmSrc=AC.createBufferSource();bgmGain=AC.createGain();bgmGain.gain.value=SND.bgm[1];
 bgmSrc.buffer=buf.bgm;bgmSrc.loop=true;bgmSrc.loopStart=BGM_LOOP[0];bgmSrc.loopEnd=Math.min(BGM_LOOP[1],buf.bgm.duration-1/44100);
 bgmSrc.connect(bgmGain).connect(AC.destination);bgmSrc.start()}
function stopBgm(fade){wantBgm=false;if(!bgmSrc)return;const s=bgmSrc,g=bgmGain;bgmSrc=null;
 g.gain.setTargetAtTime(0,AC.currentTime,(fade||.3)/3);setTimeout(()=>{try{s.stop()}catch(e){}},(fade||.3)*1000+200)}
$("snd").onclick=()=>{S.mute=!S.mute;store();$("snd").textContent=S.mute?"🔇":"🔊";initAudio();
 if(S.mute){const w=wantBgm;stopBgm(.1);wantBgm=w}else if(wantBgm)playBgm()};
$("snd").textContent=S.mute?"🔇":"🔊";

// ---- タイトル ----
function opts(el,list,key,fmt){el.innerHTML="";list.forEach(v=>{const b=document.createElement("button");b.className="opt"+(S[key]==v?" on":"");
 b.textContent=fmt(v);b.onclick=()=>{S[key]=v;store();renderTitle()};el.appendChild(b)})}
function renderTitle(){
 opts($("optPlayers"),[1,2,3,4],"players",v=>v+"人");
 opts($("optPairs"),[6,8,12,18],"pairs",v=>v*2+"枚");
 if(S.sel.length>S.players)S.sel=S.sel.slice(-S.players);
 S.names=S.sel;
 $("plist").innerHTML="";
 Object.keys(CHARS).forEach(n=>{const b=document.createElement("div");const k=S.sel.indexOf(n);
  b.className="ch"+(k>=0?" on":"");
  b.innerHTML=(k>=0&&S.players>1?`<span class="no">${k+1}</span>`:"")+`<img src="img/chars/${CHARS[n]}.png" alt=""><div class="cn">${n}</div>`;
  b.onclick=()=>{if(k>=0){if(S.sel.length>1)S.sel.splice(k,1)}else{S.sel.push(n);if(S.sel.length>S.players)S.sel.shift()}store();renderTitle()};
  $("plist").appendChild(b)});
 $("selInfo").textContent=S.players>1?`（${S.sel.length}/${S.players}人。押した順に交代）`:"";
 $("start").disabled=S.sel.length<S.players;$("start").style.opacity=S.sel.length<S.players?.5:1;
 const hn=S.sel[0];$("histName").textContent=hn;$("clearName").textContent=hn;const h=save.people[hn]||[];
 $("clearHist").style.display=h.length?"":"none";
 const st=stats(hn);
 $("hist").innerHTML=h.length?`<div style="font-size:13px;margin-bottom:4px">${S.pairs*2}枚：${st.n}回中 ${st.ok}回クリア／最速 <b>${fmtS(st.best)}</b></div>`+
  "<table><tr><th>日時</th><th>枚数</th><th>結果</th><th>めくった回数</th></tr>"+
  h.slice(0,15).map(e=>`<tr${e.p==S.pairs&&e.c&&e.t==st.best?' style="color:#c75c97;font-weight:bold"':""}><td>${fmtD(e.d)}</td><td>${e.p*2}</td><td>${
   !("c" in e)?e.s+"組（前のルール）":e.c?fmtS(e.t):"失敗（"+e.s+"組）"}</td><td>${e.m}</td></tr>`).join("")+"</table>"
  :"<div style='opacity:.6;font-size:13px'>まだ遊んでいません</div>";
 renderRank();
}
// ---- ランキング（いま選んでいるカードの枚数で、4人を比べる） ----
const RANKS=[["avg","平均"],["best","最速"],["first","1回目"],["streak","連続成功"]];
let rankTab="best";
const fmtS=t=>t==null?"—":t.toFixed(2)+"秒";
function stats(n){
 const l=(save.people[n]||[]).filter(e=>e.p==S.pairs&&"c" in e).slice().reverse(); // 古い順
 const ts=l.filter(e=>e.c).map(e=>e.t);let run=0,streak=0;
 for(const e of l){run=e.c?run+1:0;streak=Math.max(streak,run)}
 return {n:l.length,ok:ts.length,avg:ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null,best:ts.length?Math.min(...ts):null,
  first:l.length?(l[0].c?l[0].t:"fail"):null,streak,now:run};
}
function renderRank(){
 $("rankTabs").innerHTML="";
 RANKS.forEach(([k,lab])=>{const b=document.createElement("button");b.className="opt"+(k==rankTab?" on":"");b.style.fontSize="13px";b.style.minWidth="0";
  b.textContent=lab;b.onclick=()=>{rankTab=k;renderRank()};$("rankTabs").appendChild(b)});
 $("rankSub").textContent=`（${S.pairs*2}枚・${LIMIT}秒以内に全部そろえたらクリア）`;
 const rows=Object.keys(CHARS).map(n=>({n,st:stats(n)})).filter(r=>r.st.n>0);
 if(!rows.length){$("rank").innerHTML="<div style='opacity:.6;font-size:13px'>まだ記録がありません</div>";return}
 const v=r=>rankTab=="streak"?-r.st.streak:rankTab=="first"?(r.st.first=="fail"?1e9:r.st.first):(r.st[rankTab]??1e9);
 rows.sort((a,b)=>v(a)-v(b));
 const show=r=>rankTab=="streak"?`${r.st.streak}回<span style="font-size:11px;opacity:.7">（いま${r.st.now}）</span>`:
  rankTab=="first"?(r.st.first=="fail"?"失敗":fmtS(r.st.first)):fmtS(r.st[rankTab]);
 let rank=0,prev;
 $("rank").innerHTML="<table><tr><th>順位</th><th></th><th>名前</th><th>記録</th><th>クリア</th></tr>"+rows.map((r,i)=>{
  if(v(r)!==prev){rank=i+1;prev=v(r)}
  return `<tr><td>${v(r)>=1e9?"—":rank+"位"}</td><td><img src="img/chars/${CHARS[r.n]}.png" style="height:34px"></td><td>${esc(r.n)}</td><td><b>${show(r)}</b></td><td>${r.st.ok}/${r.st.n}</td></tr>`}).join("")+"</table>";
}
const fmtD=d=>{const t=new Date(d);return `${t.getMonth()+1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`};
// 履歴を消す（そのキャラの履歴だけ。ランキングの記録は残す）。元に戻せないので確認する
$("clearHist").onclick=()=>{const n=S.sel[0];
 if(!confirm(`${n} の履歴（${save.people[n].length}回分）を消します。元に戻せません。よろしいですか？`))return;
 save.people[n]=[];store();renderTitle()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- ゲーム ----
let G;
function deal(){
 const keys=Object.keys(FOODS).sort(()=>Math.random()-.5).slice(0,S.pairs);
 const deck=[...keys,...keys,...HAZURE.map((h,i)=>"!"+i)];for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
 G.deck=deck;G.open=[];G.left=S.pairs;
 // 列の数：画面の高さに収まる範囲で、カードができるだけ大きくなる数
 const W=$("board").clientWidth||360,Hh=window.innerHeight-170;let cols=3,bestSz=0;
 for(let c=3;c<=6;c++){const rows=Math.ceil(deck.length/c),w=(W-5*(c-1))/c,sz=Math.min(w,(Hh-5*(rows-1))/rows/1.2);if(sz>bestSz){bestSz=sz;cols=c}}
 const b=$("board");b.style.gridTemplateColumns=`repeat(${cols},1fr)`;b.innerHTML="";
 deck.forEach((k,i)=>{const c=document.createElement("div");c.className="card";
  const hz=k[0]=="!"?HAZURE[+k.slice(1)]:null;
  c.innerHTML=hz?`<div class="in"><div class="b">✦</div><div class="f bad"><img src="img/hazure_${hz.k}.png" alt=""><div class="nm">${hz.sec?"ハズレ −"+hz.sec+"秒":"ハズレ（セーフ）"}</div></div></div>`
   :`<div class="in"><div class="b">✦</div><div class="f"><img src="img/${k}.png" alt=""><div class="nm">${FOODS[k]}</div></div></div>`;
  c.onpointerdown=e=>{e.preventDefault();flip(i,c)};b.appendChild(c)});
}
function start(){initAudio();G={turn:0,score:Array(S.players).fill(0),moves:Array(S.players).fill(0),res:S.names.map(()=>({c:false,t:null}))};
 $("title").classList.add("hide");$("game").classList.remove("hide");turnStart()}
function turnStart(){
 G.running=false;deal();hud(LIMIT);
 const n=S.names[G.turn];
 $("result").innerHTML=`<img src="img/chars/${CHARS[n]}.png" alt="" style="height:150px"><h2>${S.players>1?esc(n)+" の番":esc(n)+` の${LIMIT}秒チャレンジ`}</h2><p>時間内なら何回でもめくれます。<br>${LIMIT}秒以内にぜんぶそろえたらクリア！</p>
 <p style="font-size:13px"><img src="img/hazure_minus.png" style="height:28px;vertical-align:middle"> どくきのこ（3枚）は −3秒<br><img src="img/hazure_none.png" style="height:28px;vertical-align:middle"> さかなのほね（1枚）はセーフ</p><button class="big" id="go">スタート</button>`;
 $("overlay").style.display="flex";
 $("go").onclick=()=>{initAudio();if(AC.state=="suspended")AC.resume();$("overlay").style.display="none";se("start");playBgm();
  G.running=true;G.t0=performance.now();G.tick=setInterval(tick,100)};
}
function tick(){const left=LIMIT-(performance.now()-G.t0)/1000;if(left<=0){hud(0);finishTurn(false);return}hud(left)}
function hud(left){
 $("who").innerHTML=`<img src="img/chars/${CHARS[S.names[G.turn]]}.png" alt="">`+esc(S.names[G.turn])+(S.players>1?` の番（${G.turn+1}/${S.players}）`:"");
 $("score").innerHTML=`そろえた <b>${G.score[G.turn]}</b> 組`;
 $("timefill").style.width=(left/LIMIT*100)+"%";$("timefill").classList.toggle("low",left<10);
 $("timetxt").textContent=`のこり ${Math.ceil(left)} 秒`;
}
function flip(i,c){
 if(!G||!G.running||c.classList.contains("up")||G.open.length>=2||G.lockOpen)return;
 c.classList.add("up");se("flip");
 if(G.deck[i][0]=="!"){ // ハズレ：ずっと表のまま残す。めくりかけの1枚目は伏せる
  const hz=HAZURE[+G.deck[i].slice(1)];
  if(G.open.length==1){const [,c1]=G.open[0];G.open=[];G.lockOpen=true;
   setTimeout(()=>{c1.classList.remove("up");G.lockOpen=false},450)}
  if(hz.sec){G.t0-=hz.sec*1000;tick()}
  const p=document.createElement("div");p.className="pen";p.textContent=hz.sec?`−${hz.sec}秒`:"セーフ";if(!hz.sec)p.style.color="#5a8a4a";
  c.appendChild(p);setTimeout(()=>p.remove(),1100);
  if(hz.sec){document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),350)}
  return;
 }
 G.open.push([i,c]);
 if(G.open.length<2)return;
 G.moves[G.turn]++;const [[a,ca],[b,cb]]=G.open;
 if(G.deck[a]==G.deck[b]){
  G.open=[];G.score[G.turn]++;G.left--;se("pair");
  setTimeout(()=>{ca.classList.add("got");cb.classList.add("got");burst(ca);burst(cb);matchFx(G.deck[a])},200);
  hud(LIMIT-(performance.now()-G.t0)/1000);
  if(G.left==0){G.res[G.turn].t=(performance.now()-G.t0)/1000;finishTurn(true)}
 }else{
  setTimeout(()=>{ca.classList.remove("up");cb.classList.remove("up");G.open=[]},550);
 }
}
// ---- そろった時の演出：カードから星と紙吹雪が飛び散る・画面が光る・材料の名前と「そろった！」が大きく出る ----
const FX_COLORS=["#ff6fa8","#ffd84a","#7fd6ff","#a98bff","#8ce07a","#ff9b5a"];
function burst(card){
 const r=card.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<18;i++){const p=document.createElement("div");p.className="spark";
  const ang=Math.random()*Math.PI*2,dist=50+Math.random()*90,star=i%3==0;
  p.textContent=star?"★":"";p.style.left=cx+"px";p.style.top=cy+"px";
  if(star){p.style.color=FX_COLORS[i%6];p.style.fontSize=(14+Math.random()*12)+"px"}
  else{p.style.background=FX_COLORS[i%6];p.style.width=p.style.height=(6+Math.random()*6)+"px";p.style.borderRadius=Math.random()<.5?"50%":"2px"}
  p.style.setProperty("--dx",Math.cos(ang)*dist+"px");p.style.setProperty("--dy",Math.sin(ang)*dist+"px");p.style.setProperty("--rot",(Math.random()*720-360)+"deg");
  document.body.appendChild(p);setTimeout(()=>p.remove(),900)}
 const ring=document.createElement("div");ring.className="ring";ring.style.left=cx+"px";ring.style.top=cy+"px";
 document.body.appendChild(ring);setTimeout(()=>ring.remove(),600);
}
function matchFx(key){
 const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),450);
 const t=document.createElement("div");t.className="matchTxt";
 t.innerHTML=`<img src="img/${key}.png"><div>${FOODS[key]}</div><b>そろった！</b>`;
 document.body.appendChild(t);setTimeout(()=>t.remove(),900);
}
// 1人の番のおわり（cleared＝40秒以内に全部そろえた）。結果をその人の履歴に入れる
function finishTurn(cleared){
 clearInterval(G.tick);G.running=false;stopBgm(.8);se("clear");
 const i=G.turn,n=S.names[i],R=G.res[i];R.c=cleared;
 const before=stats(n);
 save.people[n].unshift({d:Date.now(),p:S.pairs,c:cleared,t:cleared?+R.t.toFixed(2):null,s:G.score[i],m:G.moves[i]});
 save.people[n].splice(300);store();
 const after=stats(n);
 const msg=cleared?`<h2>🎉 クリア！</h2><p style="font-size:22px"><b>${fmtS(R.t)}</b></p>${before.best==null||R.t<before.best?"<p>🏆 最速タイム更新！</p>":""}`
  :`<h2>⏰ 時間切れ…</h2><p style="font-size:18px">${G.score[i]} / ${S.pairs} 組</p>`;
 const sub=`<p style="font-size:13px">めくった回数 ${G.moves[i]}　連続成功 ${after.now}回</p>`;
 if(S.players>1&&i<S.players-1){
  $("result").innerHTML=`<img src="img/chars/${CHARS[n]}.png" style="height:110px">`+msg+sub+`<button class="big" id="next">次の人へ</button>`;
  $("overlay").style.display="flex";$("next").onclick=()=>{G.turn++;turnStart()};return;
 }
 let h;
 if(S.players==1){h=`<img src="img/chars/${CHARS[n]}.png" style="height:110px">`+msg+sub}
 else{
  // クリアした人はタイムが速い順、失敗した人はそろえた組が多い順
  const order=S.names.map((n,k)=>k).sort((a,b)=>(G.res[b].c-G.res[a].c)||(G.res[a].c?G.res[a].t-G.res[b].t:G.score[b]-G.score[a]));
  const top=order[0];
  h=`${msg}<h2>👑 ${esc(S.names[top])} の勝ち！</h2><table>`+
   order.map((k,j)=>`<tr><td>${j+1}位</td><td><img src="img/chars/${CHARS[S.names[k]]}.png" style="height:34px"></td><td>${esc(S.names[k])}</td><td>${G.res[k].c?fmtS(G.res[k].t):"失敗（"+G.score[k]+"組）"}</td></tr>`).join("")+"</table>";
 }
 $("result").innerHTML=h+`<button class="big" id="again">もう一回</button><button class="big ghost" id="toTitle">タイトルへ</button>`;
 $("overlay").style.display="flex";
 $("again").onclick=()=>{$("overlay").style.display="none";start()};
 $("toTitle").onclick=()=>{$("overlay").style.display="none";back()};
}
function back(){if(G){clearInterval(G.tick);G.running=false}G=null;stopBgm(.3);$("overlay").style.display="none";
 $("game").classList.add("hide");$("title").classList.remove("hide");renderTitle()}
$("start").onclick=start;$("quit").onclick=back;
renderTitle();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
</script>
</body>
